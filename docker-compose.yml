services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khetai
      POSTGRES_USER: khetai
      POSTGRES_PASSWORD: khetai_dev_only
    ports:
      - "5432:5432"
    volumes:
      - khetai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khetai -d khetai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  khetai-postgres: